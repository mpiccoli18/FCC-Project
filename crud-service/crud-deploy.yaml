apiVersion: v1
kind: Service
metadata:
  name: crud-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
  selector:
    app: crud-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-api-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crud-api
  template:
    metadata:
      labels:
        app: crud-api
    spec:
      containers:
        - name: crud-api
          image: emmepiccoli/flask-crud-api:v1
          ports:
            - containerPort: 5000
          env:
            - name: DB_USER
              value: "root"
            - name: DB_NAME
              value: "testdb"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-password
                  key: password


